# Publica a página de mudança no endereço antigo (GitHub Pages). Só roda manualmente:
# ela substitui o app offline antigo, que guarda os cursos no celular.
name: Legacy pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-pages
      - id: deployment
        uses: actions/deploy-pages@v4
