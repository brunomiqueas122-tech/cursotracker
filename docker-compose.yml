# Banco local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cursotracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cursotracker_pg:/var/lib/postgresql/data

volumes:
  cursotracker_pg:
