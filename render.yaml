# Render Blueprint: Dashboard > New > Blueprint > escolha este repositório.
# Os valores com sync: false são pedidos no painel (nunca ficam no Git).
services:
  - type: web
    name: cursotracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Default
        sync: false # URL de conexão do Neon (postgresql://...)
      - key: Gemini__ApiKey
        sync: false # chave grátis criada em aistudio.google.com
      - key: Auth__InviteCode
        sync: false # código que você passa para quem pode criar conta
      - key: Premium__AdminEmails
        sync: false # e-mail da sua conta no app: libera gerar códigos premium
      - key: Premium__Contact
        sync: false # como falar com você para assinar (e-mail ou WhatsApp), aparece na tela do Premium
